{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.}} · Agent registry</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#44403c; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --card:#292524; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px; }
  header { display:flex; gap:16px; align-items:baseline; border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:20px; }
  header h1 { font-size:20px; margin:0; } header a { color:var(--muted); }
  table { width:100%; border-collapse:collapse; background:var(--card); }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; }
  .grade { font-weight:600; } .conformant { color:var(--ok); } .near-conformant { color:var(--warn); } .non-conformant { color:var(--bad); }
  .error { color:var(--bad); } .warning { color:var(--warn); } .muted { color:var(--muted); }
  form { display:flex; gap:8px; margin:12px 0 24px; } input[type=url] { flex:1; padding:6px 8px; }
  .wrap { overflow-x:auto; }
</style>
</head>
<body><main>
<header><h1>Agent registry</h1><a href="/">Agents</a><a href="/check">Card checker</a><a href="/agents">JSON</a></header>
{{end}}
{{define "foot"}}</main></body></html>{{end}}
